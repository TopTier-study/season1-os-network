name: Slack - Discussion Notify

on:
  discussion:
    types: [created]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Post discussion to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DISCUSSION_WEBHOOK }}

          REPO: ${{ github.repository }}
          TITLE: ${{ github.event.discussion.title }}
          URL: ${{ github.event.discussion.html_url }}
          AUTHOR: ${{ github.event.discussion.user.login }}
          CATEGORY: ${{ github.event.discussion.category.name }}
          BODY: ${{ github.event.discussion.body }}
          LABELS: ${{ join(github.event.discussion.labels.*.name, ', ') }}

        run: |
          set -e

          TARGET=$(printf "%s" "$BODY" | awk '
            BEGIN { inTarget=0; target="" }

            /^#{2,3}[[:space:]]*질문 대상[[:space:]]*$/ { inTarget=1; next }

            inTarget==1 {
              if ($0 ~ /^[[:space:]]*$/) next
              target=$0
              gsub(/^[[:space:]]*[-*][[:space:]]*/, "", target)
              gsub(/^[[:space:]]+|[[:space:]]+$/, "", target)
              inTarget=0
            }

            END { print target }
          ')

          if [ -z "$TARGET" ]; then
            TARGET="지정 안 함 (전체)"
          fi

          mention=""
          case "$TARGET" in
            "지연") mention="<@U0AGAT6C15G>" ;;
            "윤서") mention="<@U0AGCV8GPJA>" ;;
            "선재") mention="<@U0AGTH6D96V>" ;;
            "상유") mention="<@U0AFZ6BK5GX>" ;;
            "성국") mention="<@U0AFZ6KK7L7>" ;;
            "귀로") mention="<@U0AGJ7XTTJQ>" ;;
            *) mention="" ;;
          esac

          if [ -z "$LABELS" ]; then
            LABELS="none"
          fi

          if [ "$CATEGORY" = "Q&A" ] || [ "$CATEGORY" = "QnA" ] || [ "$CATEGORY" = "QNA" ]; then
            cat_emoji="❓"
          else
            cat_emoji="💬"
          fi

          if [ -n "$mention" ]; then
            header_text="📢 $mention *New Discussion Created!*"
          else
            header_text="📢 *New Discussion Created!*"
          fi

          payload=$(jq -n \
            --arg header "$header_text" \
            --arg repo "$REPO" \
            --arg title "$TITLE" \
            --arg url "$URL" \
            --arg author "$AUTHOR" \
            --arg category "$CATEGORY" \
            --arg target "$TARGET" \
            --arg labelsRaw "$LABELS" \
            --arg catEmoji "$cat_emoji" \
            '{
              attachments: [
                {
                  color: "9B59B6",
                  blocks: [
                    { type: "section", text: { type: "mrkdwn", text: $header } },
                    { type: "divider" },
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: ("*" + $catEmoji + " <" + $url + "|" + $title + ">*\n📦 _" + $repo + "_")
                      }
                    },
                    {
                      type: "section",
                      fields: [
                        { type: "mrkdwn", text: ("🗂 *Category*\n" + $category) },
                        { type: "mrkdwn", text: ("👤 *Author*\n" + $author) },
                        { type: "mrkdwn", text: ("🎯 *Target*\n" + $target) },
                        {
                          type: "mrkdwn",
                          text: ("🏷 *Labels*\n" + (
                            if $labelsRaw == "none" then
                              "`none`"
                            else
                              ("`" + ($labelsRaw | gsub(",\\s*"; "` `")) + "`")
                            end
                          ))
                        }
                      ]
                    },
                    {
                      type: "actions",
                      elements: [
                        { type: "button", text: { type: "plain_text", text: "🔗 Open Discussion" }, url: $url }
                      ]
                    }
                  ]
                }
              ]
            }'
          )

          curl -X POST -H 'Content-type: application/json' --data "$payload" "$SLACK_WEBHOOK_URL"
