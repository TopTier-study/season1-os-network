<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="1200" height="760" fill="#ffffff"/>

  <text x="40" y="52" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#111827">Packet Structure by Layer (Same 3500B Example)</text>
  <text x="40" y="84" font-family="Arial, sans-serif" font-size="19" fill="#374151">Packet #1 on wire = Ethernet(14) + IPv4(20) + TCP(20) + Payload(1460) + FCS(4) = 1518B</text>

  <rect x="40" y="120" width="1120" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="158" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Packet #1 (Full-size packet)</text>

  <rect x="60" y="188" width="120" height="70" fill="#fca5a5" stroke="#b91c1c"/>
  <rect x="180" y="188" width="150" height="70" fill="#fde68a" stroke="#92400e"/>
  <rect x="330" y="188" width="150" height="70" fill="#fdba74" stroke="#9a3412"/>
  <rect x="480" y="188" width="500" height="70" fill="#86efac" stroke="#166534"/>
  <rect x="980" y="188" width="120" height="70" fill="#c4b5fd" stroke="#6d28d9"/>

  <text x="120" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">Ethernet</text>
  <text x="120" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">14B</text>

  <text x="255" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">IPv4 Header</text>
  <text x="255" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">20B</text>

  <text x="405" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">TCP Header</text>
  <text x="405" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">20B</text>

  <text x="730" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">Payload</text>
  <text x="730" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">1460B</text>

  <text x="1040" y="229" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">FCS</text>
  <text x="1040" y="248" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#111827">4B</text>

  <rect x="40" y="330" width="1120" height="180" rx="12" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="60" y="368" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0f172a">Packet #3 (Tail packet)</text>

  <rect x="60" y="398" width="120" height="70" fill="#fca5a5" stroke="#b91c1c"/>
  <rect x="180" y="398" width="150" height="70" fill="#fde68a" stroke="#92400e"/>
  <rect x="330" y="398" width="150" height="70" fill="#fdba74" stroke="#9a3412"/>
  <rect x="480" y="398" width="200" height="70" fill="#86efac" stroke="#166534"/>
  <rect x="680" y="398" width="120" height="70" fill="#c4b5fd" stroke="#6d28d9"/>

  <text x="580" y="439" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#111827">Payload 580B</text>
  <text x="880" y="439" font-family="Arial, sans-serif" font-size="16" fill="#374151">Total on wire: 638B</text>

  <rect x="40" y="544" width="1120" height="170" rx="12" fill="#ecfeff" stroke="#0e7490"/>
  <text x="60" y="580" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">What changes and what stays</text>
  <text x="60" y="614" font-family="Arial, sans-serif" font-size="18" fill="#1f2937">- Header fields carry routing, integrity, and reliability info.</text>
  <text x="60" y="642" font-family="Arial, sans-serif" font-size="18" fill="#1f2937">- Payload size changes per packet (1460B, 1460B, 580B).</text>
  <text x="60" y="670" font-family="Arial, sans-serif" font-size="18" fill="#1f2937">- Header overhead repeats per packet, so smaller packets increase overhead ratio.</text>
</svg>
