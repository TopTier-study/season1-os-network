<svg xmlns="http://www.w3.org/2000/svg" width="980" height="320" viewBox="0 0 980 320">
  <rect width="980" height="320" fill="#f8fafc"/>
  <text x="30" y="35" font-family="Arial" font-size="22" fill="#0f172a">TOCTOU (Time-of-Check to Time-of-Use)</text>

  <line x1="90" y1="80" x2="900" y2="80" stroke="#64748b" stroke-width="2"/>
  <polygon points="900,80 888,74 888,86" fill="#64748b"/>
  <text x="90" y="65" font-family="Arial" font-size="14" fill="#334155">time</text>

  <rect x="120" y="110" width="190" height="58" rx="8" fill="#dbeafe" stroke="#2563eb"/>
  <text x="136" y="135" font-family="Arial" font-size="14" fill="#1e3a8a">1) check(path)</text>
  <text x="136" y="155" font-family="Arial" font-size="14" fill="#1e3a8a">allowed = true</text>

  <rect x="350" y="110" width="250" height="58" rx="8" fill="#fee2e2" stroke="#dc2626"/>
  <text x="366" y="135" font-family="Arial" font-size="14" fill="#7f1d1d">2) attacker swaps target</text>
  <text x="366" y="155" font-family="Arial" font-size="14" fill="#7f1d1d">safe file -> sensitive file</text>

  <rect x="640" y="110" width="210" height="58" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="656" y="135" font-family="Arial" font-size="14" fill="#14532d">3) use(path)</text>
  <text x="656" y="155" font-family="Arial" font-size="14" fill="#14532d">open/write executes</text>

  <line x1="310" y1="139" x2="350" y2="139" stroke="#475569" stroke-width="2"/>
  <line x1="600" y1="139" x2="640" y2="139" stroke="#475569" stroke-width="2"/>

  <rect x="130" y="210" width="720" height="74" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="150" y="238" font-family="Arial" font-size="16" fill="#7c2d12">Race window = between CHECK and USE.</text>
  <text x="150" y="262" font-family="Arial" font-size="16" fill="#7c2d12">Mitigation: atomic open/validate sequence, file-descriptor based checks, avoid path re-resolution.</text>
</svg>
